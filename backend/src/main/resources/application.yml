spring:
  application:
    name: haassistant
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/haassistant}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

haassistant:
  ha:
    url: ${HA_URL:http://homeassistant.local:8123/}
    token: ${HA_TOKEN:}
  ollama:
    url: ${OLLAMA_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:llama3.3}
  telegram:
    # Empty token disables the bridge entirely. Allowlist is a CSV of numeric
    # chat ids; only those chats can talk to the assistant.
    token: ${TELEGRAM_TOKEN:}
    allowed-chat-ids: ${TELEGRAM_ALLOWED_CHAT_IDS:}

logging:
  level:
    com.hitorro.haassistant: DEBUG
